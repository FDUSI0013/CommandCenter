# Fulcrum Ops — single-host production stack.
#
# Public surface is Caddy on the host (80/443) → control-plane (8080).
# Everything below binds to the internal compose network only; the telemetry
# engine has no published port and is unreachable from outside the host.
#
# Engine images are built by engine/build.sh and, for a real deployment, mirrored
# into our own registry by deploy/mirror-images.sh. IMAGE_PREFIX selects which:
#   local build   IMAGE_PREFIX=fulcrum-ops              (the default)
#   mirrored      IMAGE_PREFIX=<account>.dkr.ecr.<region>.amazonaws.com/fulcrum-ops
# ENGINE_TAG has no default, deliberately. Unset, it used to expand to nothing —
# an image reference ending in ":" and an error about a malformed name that
# never mentions the variable. Which engine build a host runs is a decision, so
# compose now refuses to start until .env makes it.
# The datastore images are stock upstream builds, pulled at deploy time.

name: fulcrum-ops

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# `restart: unless-stopped` reacts to a process that EXITS. A process that is
# still running but no longer answering — a wedged JVM, a deadlocked server —
# is merely reported "unhealthy", for ever. deploy/autoheal.sh (host cron, once a
# minute) restarts unhealthy containers, and only the ones that carry this label.
# It is on the four stateless services. The datastores are left out on purpose:
# one that is unhealthy is usually recovering — replaying a log, loading a
# snapshot — and restarting it in the middle of that makes things worse.
x-autoheal: &autoheal
  fulcrum.autoheal: "true"

services:
  # ---------------------------------------------------------------- state DB
  state-db:
    image: mysql:8.4.2
    <<: [*restart, *logging]
    environment:
      MYSQL_ROOT_PASSWORD: ${STATE_DB_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${STATE_DB_NAME:-fulcrum_engine}
      MYSQL_USER: ${STATE_DB_USER:-fulcrum}
      MYSQL_PASSWORD: ${STATE_DB_PASSWORD:?set in .env}
    # MySQL 8.4 removed --default-authentication-plugin; authentication_policy is
    # its replacement. Passing the old flag makes the server abort at start-up.
    command: --authentication-policy=caching_sha2_password --max_connections=500
    volumes:
      - state-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${STATE_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1200M }

  # --------------------------------------------------------- analytics store
  analytics-keeper:
    image: zookeeper:3.9.4
    <<: [*restart, *logging]
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=analytics-keeper:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: "*"
      # The image ships with autopurge OFF (interval 0): every snapshot and every
      # 64 MB pre-allocated transaction log is kept for ever, in a volume nobody
      # looks at. Purge hourly and keep the three newest snapshots (the minimum
      # the keeper accepts) with the logs that belong to them.
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
      # The image's start script defaults the heap to -Xmx1000m, which is more
      # than this container is allowed: the JVM believes it has room the cgroup
      # will not give it, and the kernel kills the keeper once the heap grows
      # into it — stalling every analytics insert. Appended after the default, so
      # this is the -Xmx the JVM honours. The coordination state of a one-node
      # store is a few megabytes; 512 MB is generous.
      JVMFLAGS: "-Xmx512m"
    volumes:
      - analytics-keeper:/data
      # The transaction log lives in /datalog, which the image declares as a
      # VOLUME — so with nothing mounted here Docker backs it with an ANONYMOUS
      # volume. That log is the only durable record of everything since the last
      # snapshot (up to 100,000 transactions). `docker compose down && up`, or a
      # `docker volume prune`, orphans an anonymous volume: the keeper restarts
      # from the snapshot alone, silently rolled back, the replicated tables'
      # metadata no longer agrees with it, and they go read-only — ingest fails
      # for every agent until somebody runs SYSTEM RESTORE REPLICA by hand.
      #
      # A HOST THAT RAN THE EARLIER FILE must move its log across BEFORE this
      # takes effect, or the first `up -d` causes exactly that rollback:
      #   deploy/migrate-keeper-datalog.sh        (see deploy/README.md, Upgrades)
      - analytics-keeper-datalog:/datalog
    # A guard for the host where that step was forgotten. A keeper that finds a
    # snapshot but no transaction log does not complain: it starts from the
    # snapshot and carries on, rolled back — or, on a host that has only ever
    # written its first snapshot, completely empty. So refuse to start in that
    # state and say why; the store waits, read-only, and nothing is lost. The
    # migration script recognises this situation and recovers from it. Anything
    # else is handed to the image's own entrypoint and command, unchanged.
    # ($$ is compose's escape for a literal $.)
    entrypoint:
      - /bin/bash
      - -c
      - |
        shopt -s nullglob
        snapshots=(/data/version-2/snapshot.*)
        logs=(/datalog/version-2/log.*)
        if [ "$${#snapshots[@]}" -gt 0 ] && [ "$${#logs[@]}" -eq 0 ]; then
          echo "REFUSING TO START: /data holds a snapshot but /datalog holds no transaction log." >&2
          echo "This host kept its log on an anonymous volume, and starting without it would" >&2
          echo "silently roll the keeper back. Run deploy/migrate-keeper-datalog.sh (see" >&2
          echo "deploy/README.md, Upgrades). Do NOT run 'docker volume prune' first: the log is" >&2
          echo "on a volume that now looks unused." >&2
          sleep 60
          exit 1
        fi
        exec /docker-entrypoint.sh zkServer.sh start-foreground
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        # 512 MB of heap plus the JVM's own metaspace, stacks and buffers.
        limits: { memory: 768M }

  # Healthchecks address 127.0.0.1 rather than localhost throughout this file.
  # This VPC has IPv6 disabled: "localhost" resolves to ::1 first, the probe is
  # refused, and a service listening correctly on IPv4 is reported unhealthy —
  # which then blocks everything that depends_on it.
  analytics-db:
    image: clickhouse/clickhouse-server:26.3.16.16-alpine
    <<: [*restart, *logging]
    environment:
      CLICKHOUSE_DB: ${ANALYTICS_DB_NAME:-fulcrum_analytics}
      CLICKHOUSE_USER: ${ANALYTICS_DB_USER:-fulcrum}
      CLICKHOUSE_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set in .env}
      CLICKHOUSE_SKIP_USER_SETUP: 0
      # The engine provisions a restricted read-only role for its insights
      # queries, which requires SQL-driven access control to be switched on.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - analytics-db:/var/lib/clickhouse
      # Mount the single file, never the directory. The image ships its own
      # config.d/docker_related_config.xml, which is what makes the server
      # listen on all interfaces instead of loopback; mounting over the
      # directory hides it, and the server then refuses every connection from
      # the rest of the compose network while still passing its own healthcheck.
      - ./clickhouse/config.d/fulcrum.xml:/etc/clickhouse-server/config.d/fulcrum.xml:ro
      - ./clickhouse/users.d/fulcrum.xml:/etc/clickhouse-server/users.d/fulcrum.xml:ro
    depends_on:
      analytics-keeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 5G }

  # ----------------------------------------------------------- cache / queues
  cache:
    image: redis:7.2.4-alpine3.19
    <<: [*restart, *logging]
    command: ["redis-server", "--requirepass", "${CACHE_PASSWORD:?set in .env}", "--maxmemory", "700mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 900M }

  # ------------------------------------------------------------ blob storage
  blob-store:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BLOB_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${BLOB_SECRET_KEY:?set in .env}
    volumes:
      - blob-store:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 600M }

  blob-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      blob-store:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://blob-store:9000 ${BLOB_ACCESS_KEY} ${BLOB_SECRET_KEY} &&
      (mc ls local/${BLOB_BUCKET:-fulcrum-attachments} || mc mb local/${BLOB_BUCKET:-fulcrum-attachments}) &&
      exit 0"
    restart: "no"

  # ----------------------------------------------------- user metric sandbox
  metric-runner:
    image: ${IMAGE_PREFIX:-fulcrum-ops}/metric-runner:${ENGINE_TAG:?set in .env}
    <<: [*restart, *logging]
    labels: *autoheal
    environment:
      PYTHONUNBUFFERED: 1
      # The image bakes in "docker", which starts docker-in-docker and needs
      # privileged: true — without it the entrypoint waits for a daemon that
      # can never start and the container crash-loops. "process" runs user
      # metric code in an isolated exec namespace with no daemon at all, and is
      # the vendor's own self-hosted default.
      PYTHON_CODE_EXECUTOR_STRATEGY: process
      # The runner pre-forks this many executor processes and keeps them warm.
      # Each imports the whole metric library and settles at ~310 MB, so the
      # memory limit below has to cover PARALLEL_NUM x 310 MB plus the server.
      # It used to be 5 (the image default) under a 900 MB limit: the fifth
      # process could never fit, the kernel killed it, the pool forked another,
      # and that loop ran ~450 times an hour at a full core — invisibly, since
      # the gunicorn master survived and the container never restarted.
      PYTHON_CODE_EXECUTOR_PARALLEL_NUM: ${METRIC_RUNNER_PARALLEL:-4}
    # CPU weight under contention (default 1024). See the note on control-plane:
    # user-supplied metric code is the last thing on this host that should win
    # a fight for a core.
    cpu_shares: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 4 -O /dev/null http://127.0.0.1:8000/healthcheck || exit 1"]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        # User-supplied metric code runs here. It may have one and a half cores
        # and no more, so a runaway metric cannot starve the API beside it.
        limits: { memory: 2500M, cpus: "1.5" }

  # -------------------------------------------------------- safety inference
  safety-scanner:
    image: ${IMAGE_PREFIX:-fulcrum-ops}/safety-scanner:${ENGINE_TAG:?set in .env}
    <<: [*restart, *logging]
    labels: *autoheal
    environment:
      # The inference runtime sizes its thread pools from the HOST's core count
      # (4), not from the two cores the limit below allows. Four busy threads on
      # a two-core quota spend their time being throttled and context-switched,
      # which makes every scan slower, not faster. Match the pools to the quota.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthcheck', timeout=4).status==200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        limits: { memory: 3G, cpus: "2.0" }

  # ---------------------------------------------------------- the engine
  # Private telemetry engine. No published ports: reachable only as
  # http://telemetry-engine:8080 from inside this network.
  telemetry-engine:
    image: ${IMAGE_PREFIX:-fulcrum-ops}/telemetry-engine:${ENGINE_TAG:?set in .env}
    <<: [*restart, *logging]
    labels: *autoheal
    hostname: telemetry-engine
    command: ["bash", "-c", "./run_db_migrations.sh && ./entrypoint.sh"]
    environment:
      JAVA_OPTS: "-Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"

      STATE_DB_PROTOCOL: "jdbc:mysql://"
      STATE_DB_URL: "state-db:3306/${STATE_DB_NAME:-fulcrum_engine}?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      STATE_DB_DATABASE_NAME: ${STATE_DB_NAME:-fulcrum_engine}
      STATE_DB_USER: ${STATE_DB_USER:-fulcrum}
      STATE_DB_PASS: ${STATE_DB_PASSWORD}

      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://analytics-db:8123"
      ANALYTICS_DB_MIGRATIONS_USER: ${ANALYTICS_DB_USER:-fulcrum}
      ANALYTICS_DB_MIGRATIONS_PASS: ${ANALYTICS_DB_PASSWORD}
      ANALYTICS_DB_PROTOCOL: "HTTP"
      ANALYTICS_DB_HOST: "analytics-db"
      ANALYTICS_DB_PORT: 8123
      ANALYTICS_DB_DATABASE_NAME: ${ANALYTICS_DB_NAME:-fulcrum_analytics}
      ANALYTICS_DB_USERNAME: ${ANALYTICS_DB_USER:-fulcrum}
      ANALYTICS_DB_PASS: ${ANALYTICS_DB_PASSWORD}

      REDIS_URL: "redis://:${CACHE_PASSWORD}@cache:6379/"

      AWS_ACCESS_KEY_ID: ${BLOB_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BLOB_SECRET_KEY}
      IS_MINIO: "true"
      S3_URL: "http://blob-store:9000"
      S3_BUCKET: ${BLOB_BUCKET:-fulcrum-attachments}

      PYTHON_EVALUATOR_URL: "http://metric-runner:8000"

      # Feature toggles for the capabilities the console exposes.
      TOGGLE_GUARDRAILS_ENABLED: "true"
      TOGGLE_WELCOME_WIZARD_ENABLED: "false"

      # Outbound reporting is not configured here on purpose: it is pinned off
      # inside the image by engine/patch-vendor.sh, where no environment
      # variable can switch it back on. engine/build.sh fails the build if that
      # is ever untrue, and deploy/verify-no-egress.sh re-checks it on the host.

      AUTH_ENABLED: "false"   # identity is owned by the control plane in front
      CORS: "false"           # never called by a browser directly
    depends_on:
      state-db: { condition: service_healthy }
      analytics-db: { condition: service_healthy }
      cache: { condition: service_healthy }
      blob-store: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health-check"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    # tmpfs pages are charged to this container's memory limit. Unsized, /tmp
    # may grow to half the host's RAM on paper, and what actually stops it is
    # the kernel killing the JVM. The heap takes 3 of the 4 GB (MaxRAMPercentage
    # above), so 1 GB is all /tmp could ever have had; saying so turns that kill
    # into an ordinary "no space left" on the one write that was too big.
    tmpfs:
      - /tmp:size=1g
    deploy:
      resources:
        limits: { memory: 4G }

  # ------------------------------------------------------- our control plane
  control-plane:
    build:
      # Repository root: the image carries both the API and the console.
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    image: fulcrum-ops/control-plane:${APP_TAG:-local}
    <<: [*restart, *logging]
    labels: *autoheal
    environment:
      FULCRUM_OPS_ENVIRONMENT: production
      FULCRUM_OPS_SECRET_KEY: ${APP_SECRET_KEY:?set in .env}
      FULCRUM_OPS_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set in .env}
      FULCRUM_OPS_DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-fulcrum}:${APP_DB_PASSWORD}@app-db:5432/${APP_DB_NAME:-fulcrum_ops}
      FULCRUM_OPS_ENGINE_BASE_URL: http://telemetry-engine:8080
      # The guardrail scanner answers on its own service, not through the
      # engine gateway; without this, guardrail checks 404 and degrade open.
      FULCRUM_OPS_ENGINE_CHECKER_URL: http://safety-scanner:5000
      FULCRUM_OPS_ENGINE_WORKSPACE: default
      FULCRUM_OPS_ENGINE_METRIC_LIBRARY: ${ENGINE_METRIC_LIBRARY:-}
      FULCRUM_OPS_REDIS_URL: redis://:${CACHE_PASSWORD}@cache:6379/1
      FULCRUM_OPS_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in .env}
      FULCRUM_OPS_CORS_ORIGINS: ${PUBLIC_BASE_URL}
      FULCRUM_OPS_LOG_JSON: "true"
      # Prompt Studio execution: optional — with these unset, Run answers 503
      # model_unavailable naming exactly what is missing.
      FULCRUM_OPS_PROMPT_STUDIO_ENDPOINT: ${PROMPT_STUDIO_ENDPOINT:-}
      FULCRUM_OPS_PROMPT_STUDIO_API_KEY: ${PROMPT_STUDIO_API_KEY:-}
      FULCRUM_OPS_PROMPT_STUDIO_MODEL: ${PROMPT_STUDIO_MODEL:-gpt-4o-mini}
      FULCRUM_OPS_PROMPT_STUDIO_API_VERSION: ${PROMPT_STUDIO_API_VERSION:-2024-10-21}
    volumes:
      # Generated exports must outlive the container: without this every
      # rebuild silently expires every downloadable file.
      - export-spool:/app/var/exports
    ports:
      - "127.0.0.1:8080:8080"   # Caddy on the host is the only client
    depends_on:
      app-db: { condition: service_healthy }
      # Started, not healthy. The governance half of the product works without
      # the engine and says so; waiting for a healthy engine meant a control-plane
      # hotfix could not be deployed (`up -d control-plane` refused) at exactly
      # the moment the engine was the thing that was broken.
      telemetry-engine: { condition: service_started }
    # CPU weight under contention (default 1024; it costs nothing while cores are
    # idle). Four cores are shared with a scanner running model inference and a
    # runner executing user code, and either can take all of them. The API and
    # its database are what a person at the console and an agent at ingest are
    # waiting for, so they are served first: 2048 here and on app-db, 1024 for
    # the engine and its stores, 512 for the scanner, 256 for the runner.
    cpu_shares: 2048
    healthcheck:
      # LIVENESS, not readiness: "is this process answering HTTP". /health says
      # 503 when the engine (or the database) is down, and that is the right
      # answer for a person or a monitor — but deploy/autoheal.sh restarts what
      # this probe calls unhealthy, and restarting the API cannot mend the
      # engine: it would only take login and the governance screens down with
      # it, in a loop, for as long as the engine stayed away. So 200 and 503 both
      # pass; no answer inside five seconds, or a refused connection, fails.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=5)
          except urllib.error.HTTPError as answered:
              sys.exit(0 if answered.code == 503 else 1)
      interval: 15s
      timeout: 8s
      # One minute of silence is a wedged process. It was five (20 x 15 s).
      retries: 4
      # Migrations run before the server binds. Failures inside this window do
      # not count and the first success ends it, so a generous value is free.
      start_period: 180s
    deploy:
      resources:
        # Four workers at ~240 MB each sat at 870 MB of a 1 GB limit — one busy
        # export away from the kernel killing the API. The host has 32 GB.
        limits: { memory: 3G }

  app-db:
    image: postgres:16.4-alpine
    <<: [*restart, *logging]
    # max_connections: the API opens workers x (pool_size + max_overflow)
    # connections — 4 x 16 = 64 — and the scheduler, the backup and an operator's
    # psql need room on top. At the default of 100 against the old 4 x 30 a busy
    # hour ended in "sorry, too many clients already".
    # idle_in_transaction_session_timeout: a request that dies holding a
    # transaction open must not pin its connection for ever.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - idle_in_transaction_session_timeout=300000
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-fulcrum_ops}
      POSTGRES_USER: ${APP_DB_USER:-fulcrum}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - app-db:/var/lib/postgresql/data
    cpu_shares: 2048   # every API request waits on this; see control-plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-fulcrum} -d ${APP_DB_NAME:-fulcrum_ops}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 1500M }

volumes:
  state-db:
  analytics-db:
  analytics-keeper:
  analytics-keeper-datalog:
  cache:
  blob-store:
  app-db:
  export-spool:
