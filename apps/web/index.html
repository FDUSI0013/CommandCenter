<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FD AI Command Center</title>
<meta name="application-name" content="FD AI Command Center">
<meta name="apple-mobile-web-app-title" content="FD AI Command Center">
<meta name="theme-color" content="#2A0854">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <!-- The brand plate is the logo's own ground colour, so the logo's built-in
         margin disappears into it; css/app.css (.brand) explains the offsets.
         The "FD" of the name is drawn in the logo's letterforms (.fd-mark) and
         still reads and copies as the text "FD". -->
    <div class="brand" id="brand">
      <div class="brand-top">
        <img class="brand-logo" src="img/fd-ryze-logo.png" width="326" height="88" alt="FD RYZE">
        <div class="brand-status"><span class="dot pulse"></span>LIVE</div>
      </div>
      <div class="brand-name"><span class="fd-mark"><span>FD</span></span> AI Command Center</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <!-- Empty and hidden until /auth/me answers: the shell must never show a
         person who is not the one signed in (app.js renderUserCard fills it). -->
    <div class="user-card" id="userCard" style="visibility:hidden">
      <div class="avatar av-purple"></div>
      <div class="user-meta">
        <div class="user-name"></div>
        <div class="user-role"></div>
      </div>
      <span class="user-caret" id="userCaret"></span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main-wrap">
    <main class="main" id="main">
      <!-- screens render here -->
    </main>
  </div>

</div>

<!-- overlays -->
<div id="dropdown-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/login.js"></script>
<script src="js/screens-platform.js"></script>
<script src="js/screens-governance.js"></script>
<script src="js/screens-config.js"></script>
<script src="js/screens-ops.js"></script>
<script src="js/screens-quality.js"></script>
<script src="js/screens-system.js"></script>
<script src="js/screens-llm.js"></script>
<script src="js/app.js"></script>
</body>
</html>
