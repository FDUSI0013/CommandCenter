<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236D4AEF'/%3E%3Cpath d='M17.5 5L9 18h6l-1.5 9L22 14h-6l1.5-9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brand">
      <div class="brand-icon" id="brandIcon"></div>
      <div>
        <div class="brand-name">AI Command Center</div>
        <div class="brand-status"><span class="dot pulse"></span>LIVE</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <!-- Empty and hidden until /auth/me answers: the shell must never show a
         person who is not the one signed in (app.js renderUserCard fills it). -->
    <div class="user-card" id="userCard" style="visibility:hidden">
      <div class="avatar av-purple"></div>
      <div class="user-meta">
        <div class="user-name"></div>
        <div class="user-role"></div>
      </div>
      <span class="user-caret" id="userCaret"></span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main-wrap">
    <main class="main" id="main">
      <!-- screens render here -->
    </main>
  </div>

</div>

<!-- overlays -->
<div id="dropdown-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/login.js"></script>
<script src="js/screens-platform.js"></script>
<script src="js/screens-governance.js"></script>
<script src="js/screens-config.js"></script>
<script src="js/screens-ops.js"></script>
<script src="js/screens-quality.js"></script>
<script src="js/screens-system.js"></script>
<script src="js/app.js"></script>
</body>
</html>
